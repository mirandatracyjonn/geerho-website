<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Geerho</title>
  <meta name="description" content="Browse items for sale, auctions, and tool rentals on Geerho.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="browse.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header"><div class="inner">
  <a class="brand" href="index.html"><img src="favicon.png" alt="" width="28" height="28">Geerho</a>
  <nav aria-label="Site">
    <a href="browse.html" aria-current="page">Browse</a>
    <a href="about.html">About</a>
    <a href="news.html">News</a>
    <a href="investors.html">Investors</a>
    <a href="faq.html">FAQ</a>
    <a href="download.html" class="nav-cta">Get the app</a>
  </nav>
</div></header>
<main id="main" tabindex="-1" class="wide">
  <h1>Browse</h1>
  <p class="meta">Everything active on Geerho right now. To buy, bid, or rent, <a href="download.html">get the app</a>.</p>

  <form class="filters" id="filters" role="search">
    <div class="filter-search">
      <label for="q">Search</label>
      <input type="search" id="q" name="q" placeholder="What are you looking for?">
    </div>
    <div>
      <label for="format">Type</label>
      <select id="format" name="format">
        <option value="">Everything</option>
        <option value="fixed">For sale</option>
        <option value="auction">Auctions</option>
        <option value="rental">For rent</option>
        <option value="buy_now">Buy now</option>
      </select>
    </div>
    <div>
      <label for="category">Category</label>
      <select id="category" name="category"><option value="">All categories</option></select>
    </div>
    <div>
      <label for="sort">Sort</label>
      <select id="sort" name="sort">
        <option value="newest">Newest</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="ending_soon">Ending soonest</option>
      </select>
    </div>
    <button type="submit">Search</button>
  </form>

  <p class="status-line" id="status" role="status" aria-live="polite"></p>
  <ul class="cards" id="results"></ul>
  <p class="more"><button type="button" class="secondary" id="more" hidden>Show more</button></p>
</main>
<footer class="site-footer"><div class="inner">

  <a href="privacy.html">Privacy Policy</a>
</div></footer>
</body>
</html>
